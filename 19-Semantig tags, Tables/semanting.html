<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic</title>
</head>

<body>
    <!-- header sehifenin yuxarisinda olur sehifenin basligi ve naviqasiyasi ucun istifade olunur -->
    <header>
        <!-- nav taglari adinda oldugu kimi naviqaiya ucun istifade olunur header icinde olur menim yazdiqimda home about contact hisseleri var -->
        <nav>
            <ul>
                <li><a href="#home">home</a></li>
                <li><a href="#about">about</a></li>
                <li><a href="#contact">contact</a></li>
            </ul>
        </nav>
    </header>



    <!-- section taglari kodu menali bolmelere ayirmaq ucun istifade olunur  veb sehifenin basligi, altbilgisi ve esas melumat hissesi kimi bolmelerini ayirmaq ucun section taglarindan istifade edilit -->
    <section>
        <header>
            <h1>Section</h1>
        </header>
        <!-- hemcinin article taglari da semanticdir,mezmunlara bolmek ucundur ve her biri oz basliqi ola biler men yazdiqim kimi h2 ile yazdim -->
        <article>
            <h2>example of section </h2>
            <p>bu bir section ve article numunesidir</p>
        </article>

        <!-- aside tagi esas melumata aid olmayan elave melumatlar ucun istifade olunur mes. reklam yerlesdirmek ucun -->
        <aside>
            <h2>aside reklam</h2>
            <a href="#" target="_blank">burda reklam var</a>
        </aside>
        <!-- details tagi ise gizledilen melumatlari gostermek ucun istifade olunur, ustune klikleyende melumat acilir -->
        <details>
            <summary>details numunesi</summary>
            <p>bu details taginin numunesidir</p>
        </details>
        <!-- figure ve figcaption taglari sekil ve onun alt yazisi ucun istifade olunur -->
        <figure>
            <img src="https://picsum.photos/200/300" alt="picsium image">
            <figcaption>figure ve figcaption numunesi</figcaption>
        </figure>
        <!-- mark tagi ise vurgu ucun istifade olunur -->
        <p>Mark istifade edilir <mark>burda</mark></p>
    </section>





    <!-- footer de semanticdir ve sehifenin en altinda olub elaqe melumatlari ve copyright melumatlari kimi melumatlar ucun istifade olunur -->
    <footer>
        <p>2024 © All rights reserved.</p>
        <a href="https://instagram.com" target="_blank">contact us </a>
    </footer>
</body>

</html>
