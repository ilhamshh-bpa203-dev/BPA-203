<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="/assets/css/style1.css">

</head>

<body>

    <section class="ilk style">
        <div class="Login-card">

            <div class="exit">
                <a href="#" class="x">x</a>
            </div>

            <div class="header">
                <b>Login Form</b>
            </div>

            <div class="contact">
                <label for="emorph">Email or Phone</label> <br>
                <input class="contact-input" type="text" id="emorph" name="emorph">

            </div>
            <div class="password">
                <label for="password">Password</label> <br>
                <input class="contact-input" type="password" id="password" name="password">
            </div>

            <div class="forgot-password">
                <a href="#">Forgot Password?</a>

            </div>

            <div class="login-back">
                <div class="login-text">
                    <a href="#" class="lg">Login</a>

                </div>
            </div>

            <div class="new-signup">
                <div class="notmem-text">
                    <p>Not a member?</p>

                </div>
                <div class="signup-text">
                    <a href="#">Sign Up now</a>
                </div>

            </div>


        </div>

    </section>

</body>

</html>
